<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f32" />
    <meta name="description" content="কাঞ্চন সাইকেল স্টোর্স, কোলাঘাট। সাইকেল, অ্যাক্সেসরিজ ও মেরামত সম্পর্কে জানতে যোগাযোগ করুন। দোকানে আসার পথ দেখুন।" />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="কাঞ্চন সাইকেল স্টোর্স | Kanchan Cycle Stores" />
    <meta property="og:title" content="কাঞ্চন সাইকেল স্টোর্স — আপনার পথে, আপনার পাশে।" />
    <meta property="og:description" content="আপনার পছন্দের সাইকেল খুঁজুন। কোলাঘাটের কাঞ্চন সাইকেল স্টোর্সে যোগাযোগ করুন।" />
    <meta property="og:locale" content="bn_IN" />
    <meta property="og:locale:alternate" content="en_IN" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Restore a deep link after a GitHub Pages 404 redirect, before React boots.
      (function () {
        try {
          var saved = sessionStorage.getItem('kanchan-route');
          if (!saved) return;
          sessionStorage.removeItem('kanchan-route');
          var route = JSON.parse(saved);
          var base = '%BASE_URL%';
          if (typeof route.path !== 'string' || !/^\/(?!\/)/.test(route.path) || route.path.indexOf('\\') !== -1) return;
          var search = typeof route.search === 'string' ? route.search : '';
          var hash = typeof route.hash === 'string' ? route.hash : '';
          var next = new URL(base + route.path.slice(1) + search + hash, location.origin);
          if (next.origin === location.origin && next.pathname.indexOf(base) === 0) history.replaceState(null, '', next.pathname + next.search + next.hash);
        } catch (e) { /* The site also works when browser storage is unavailable. */ }
      })();
    </script>
    <title>কাঞ্চন সাইকেল স্টোর্স | কোলাঘাটের সাইকেলের দোকান</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>কাঞ্চন সাইকেল স্টোর্স — কোলাঘাট, পশ্চিমবঙ্গ। ফোন: <a href="tel:+917076884950">+91 70768 84950</a>। ওয়েবসাইটটি দেখতে ব্রাউজারে JavaScript চালু করুন।</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
