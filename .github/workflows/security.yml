name: Security checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  schedule:
    - cron: '19 4 * * 1'
permissions:
  contents: read
# Actions are pinned to commit SHAs, not floating tags: a moved tag is a
# supply-chain path into the job that runs npm with the repository token.
# Dependabot (.github/dependabot.yml) keeps these pins current.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Static security checks
        run: npm run security:check
